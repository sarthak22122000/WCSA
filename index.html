<!DOCTYPE html>
<html lang="en">
<!--
═══════════════════════════════════════════════════════════════════════════════
  WCSA SWIM STAGE CHECKER — Single self-contained HTML file
  ─────────────────────────────────────────────────────────────────────────────
  An interactive multi-step form that recommends a swim level for a child
  based on age, prior experience, and current skills.

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  HOW TO NAVIGATE THIS FILE
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  CSS (inside <style>):
    1. RESET + CSS VARIABLES   — Brand colors and fonts (edit :root here)
    2. PAGE WRAPPER            — Pool water background image
    3. LAYOUT                  — Two-column: sidebar + right-column
    4. PAGE HEADING            — "Find you child's Swim Level" white heading
    5. SIDEBAR                 — Progress ring + Swim Stages list
    6. MAIN CARD               — White card containing tracker + question UI
    7. STEP TRACKER            — Bordered grey box with 4 numbered dots
    8. QUESTION SECTION        — .q-section wrapper + .q-container styles
    9. OPTIONS GRID            — Answer buttons (3-col, 2-col, large variants)
   10. ALERT BOX               — Yellow info box (3-year exception note)
   11. NAV BUTTONS             — Back / Continue pill buttons
   12. RESULT PANEL            — Final screen with animal icon + buttons

  Markup (inside <body>):
    .page-wrapper
      └── .layout
          ├── .sidebar              (left)
          └── .right-column         (right)
              ├── .page-heading     ← Heading sits above main-card
              └── .main-card        ← Populated by JS renderAll()
                  ├── .step-tracker (1st container — top of card)
                  └── .q-section    (2nd container — holds the rest:
                                     q-container, option-grid, alert-box, nav-row)

  JavaScript (inside <script>):
    1. ASSET DEFINITIONS       — SVGs for stages and option icons
    2. DATA CONFIG             — STAGES, STEPS, AGE_OPTIONS, LEVEL_QUESTIONS,
                                 BEGINNER_QUESTIONS — EDIT QUESTION TEXT HERE
    3. STATE                   — Current step, answers, computed result
    4. HELPERS                 — Progress calculation, result builders
    5. RESULT LOGIC            — resultForAge, resultFromBeginner,
                                 resultFromLevel — EDIT RESULT TIER NOTES HERE
    6. AGE_RESULT_CONTENT      — Age-based result copy — EDIT AGE COPY HERE
    7. RENDERERS               — renderStep1..renderResult — EDIT MARKUP HERE
    8. ACTIONS                 — Click handlers (selectAge, answerLevel, etc)
    9. NAVIGATION              — continueStep, continueBeginner,
                                 continueLevel, goBack — EDIT FLOW HERE
   10. MAIN RENDER LOOP        — renderAll() ties it all together

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  FLOW OVERVIEW
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  Step 1 — AGE                                              [progress: 0%]
    └─ Under 6m / 6-12m / 12m-2y / 2-3y / 3-4y → direct result page (100%)
    └─ 4 years +                                → Step 2

  Step 2 — EXPERIENCE ("Has the child had lessons?")        [progress: 25%]
    └─ Yes                                      → Step 3 (Skills, Level 1)
    └─ No                                       → Beginner check (Q1)

       Beginner check (sub-flow of Step 2, also 25%)
         Q1 No                                  → Level 1 Turtles · BEGINNER
         Q1 Yes, Q2 No                          → Level 1 Turtles · BEGINNER
         Q1+Q2 Yes, Q3 No                       → Level 1 Turtles · IMPROVER
         All Yes                                → Level 1 Turtles · ADVANCED

  Step 3 — SKILLS (per-level questions)                     [progress: 50%]
    For each level 1..4, ask 3 questions:
      Q1 No                                     → Level X · BEGINNER
      Q2 No                                     → Level X · IMPROVER
      Q3 No                                     → Level X · ADVANCED
      Q3 Yes                                    → Move to Level X+1, Q1
    All Yes through Level 4                     → Level 5 (Dolphins/Mantas/Orcas)

  Step 4 — RESULT                                          [progress: 100%]
    Displays stage animal, headline, description, Enquire / Restart buttons.

  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  COMMON EDITS — quick reference
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  • Change brand colors          → :root CSS variables (CSS section 1)
  • Change background image      → .page-wrapper background URL (CSS section 2)
  • Edit question wording        → LEVEL_QUESTIONS / BEGINNER_QUESTIONS (JS sec 2)
  • Edit age-result copy         → AGE_RESULT_CONTENT object (JS section 6)
  • Change tier notes per level  → NOTES inside resultFromLevel() (JS section 5)
  • Change Level 5 result text   → continueLevel() — search "stageIdx: 4"
  • Change stage names/descs     → STAGES array (JS section 2)
  • Add a new age bracket        → AGE_OPTIONS + AGE_ICONS + resultForAge
  • Hook up Enquire button       → renderResult() — currently no onclick
  • Make .q-section visually     → uncomment background/border styles in CSS
    distinct (like step-tracker)   section 8 (.q-section block)
═══════════════════════════════════════════════════════════════════════════════
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your Child's Swim Level</title>
<link href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* ═══════════════════ 1. RESET + CSS VARIABLES ═══════════════════
     Base reset and brand color/font tokens. Edit colors at :root */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  :root {
    --blue: #024070;
    --yellow: #F5C842;
    --black: #000000;
    --border: #D5D5D5;
    --grey-bg: #F9F9F9;
    --text: #607380;
    --white: #ffffff;
    --font-primary: 'Poppins', sans-serif;
    --font-secondary: 'Dosis', sans-serif;
  }
  body { font-family: var(--font-secondary); background: #1A90D9; }

  /* ═══════════════════ 2. PAGE WRAPPER ═══════════════════
     Full-viewport blue container with pool-water background image.
     Replace the URL in the `background:` line below to swap the image. */
  .page-wrapper {
    background: #1A90D9 url("https://mediumvioletred-squirrel-272452.hostingersite.com/wp-content/uploads/2026/06/Stage-Checker-Age-scaled.webp") center center / cover no-repeat fixed;
    min-height: 110vh;
    padding: 24px 28px 32px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    JUSTIFY-CONTENT: center;
  }

  /* ═══════════════════ 3. LAYOUT ═══════════════════
     Two-column flexbox: sidebar (fixed width) + right-column (flex 1)
     The page-wrapper now CENTERS the .layout, so heading aligns with main card */
  .layout {
    display: flex;
    gap: 22px;
    width: 100%;
    max-width: 1280px;
    align-items: stretch;
    position: relative;
    z-index: 1;
  }

  /* Right column wraps the heading and main card so the heading
     aligns with the main card (not centered across the full page) */
  .right-column {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0; /* prevents overflow inside flex */
  }

  /* ═══════════════════ 4. PAGE HEADING ═══════════════════
     "Find you child's Swim Level" — sits at top of the right column,
     visually aligned with the main card (left edge starts at main card edge) */
  .page-heading {
    padding: 8px 4px 22px;
    text-align: center;
  }
  .page-heading h1 {
    font-family: var(--font-secondary);
    font-size: clamp(2.4rem, 5.2vw, 3.6rem);
    font-weight: 800;
    color: var(--white);
    line-height: 1.0;
    margin-bottom: 8px;
    letter-spacing: -0.01em;
  }
  .page-heading p {
    font-family: var(--font-primary);
    font-size: 1rem;
    color: rgba(255,255,255,0.95);
    font-weight: 400;
  }

  /* ═══════════════════ 5. SIDEBAR ═══════════════════
     Left panel — progress ring, "SWIM STAGES" list */
  .sidebar {
    background: #F9F9F9;
    border-radius: 35px;
    padding: 18px 12px;
    width: 320px;
    min-width: 320px;
    flex-shrink: 0;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
  }
  .sidebar-title {
    font-family: var(--font-primary);
    font-size: 25px;
    font-weight: 500;
    color: var(--blue);
    text-align: center;
    margin-bottom: 5px;
  }
  .progress-ring-wrap { display: flex; justify-content: center; margin-bottom: 20px; }
  .ring-container { position: relative; width: 120px; height: 120px; }
  .ring-svg { width: 120px; height: 120px; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: #ECECEC; stroke-width: 6; }
  .ring-fill { fill: none; stroke: var(--yellow); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 0; transition: stroke-dasharray 0.6s ease; }
  .ring-label {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-primary); font-size: 1.85rem; font-weight: 700; color: var(--blue);
  }

  .stages-label {
    font-family: var(--font-primary);
    font-size: 16px; 
    font-weight: 500;
    color: var(--text);
    text-align: center;
    text-transform: uppercase;
    margin-bottom: 14px;
    padding-top: 16px;
    border-top: 1px solid #1E98DD33;
  }
  .stage-item {
    display: flex; 
    align-items: center; 
    background: var(--white);
    gap:20px;
    padding: 10px 15px;
    border-radius: 24px;
    margin-bottom: 10px;
    border: 0.8px solid transparent;
    transition: all 0.2s;
  }

  .stage-item:last-child{
    margin-bottom:0px;
  }

  .stage-text {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

  .stage-item.active { border-color: var(--yellow); }
  .stage-icon { width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .stage-icon svg { max-width: 56px; max-height: 56px; width: auto; height: auto; }
  .stage-level { font-family: var(--font-primary); font-size: 14px; font-weight: 500; color: #1E98DD; text-transform: uppercase; letter-spacing: 0.05em; }
  .stage-name { font-family: var(--font-primary); font-size: 16px; font-weight: 500; color: var(--blue); line-height: 1.15; }
  .stage-desc { font-family: var(--font-primary); font-size: 12px; color: var(--text); line-height: 1.35; margin-top: 2px; font-weight: 400;}

  /* ═══════════════════ 6. MAIN CARD ═══════════════════
     White card on the right containing step tracker + question content */
  .main-card {
    background: #F9F9F9;
    border-radius: 35px;
    flex: 1;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
  }

  /* ═══════════════════ 7. STEP TRACKER ═══════════════════
     Bordered grey box with 4 numbered dots showing current step */
  .step-tracker {
    display: flex; 
    align-items: center;
    padding: 30px 20px;
    background: #FBFBFB;
    border-radius: 35px;
    border: 1px solid #EEEEEE;

  }
  .step-item { display: flex; align-items: center; gap: 10px; }
  .step-dot {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--yellow); color: var(--black);
    font-family: var(--font-primary); font-size: 0.88rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .step-dot.inactive { background: transparent; border: 1.5px solid var(--yellow); color: var(--text); }
  .step-label { font-family: var(--font-primary); font-size: 0.95rem; font-weight: 500; color: var(--black); }
  .step-label.inactive { color: var(--text); }
  .step-line { flex: 1; height: 0; border-top: 1.5px dashed #C8C8C8; margin: 0 14px; }

  /* ═══════════════════ 8. QUESTION SECTION ═══════════════════
     .q-section is the grouping wrapper that holds all question content
     (meta, title, subtitle, options, alert, nav buttons) — sits below
     .step-tracker inside .main-card.

     To add a background/border to the question block (like .step-tracker has),
     add styles here. Currently it's a transparent wrapper for flex layout. */
  .q-section {
    display: flex;
    flex-direction: column;
    flex: 1;
    background: #fbfbfb;
    padding: 30px;
    border-radius: 35px;
}

  /* .q-container holds just the text intro (meta + title + subtitle) */
  .q-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .q-meta {
    font-family: var(--font-primary); 
    font-size: 1.025rem; 
    color: var(--text); 
    font-weight:400;
    display: flex; 
    align-items: center; 
    gap: 8px; 
    flex-wrap: wrap;
  }
  .q-meta .dot { width: 4px; height: 4px; border-radius: 50%; background: #B0BCC4; }
  .q-title {
    font-family: var(--font-primary);
    font-size: clamp(1.45rem, 2.4vw, 1.6rem);
    font-weight: 500; 
    color: var(--blue);
    line-height: 1.2;
    width:90%;
  }
  .q-subtitle { 
    font-family: var(--font-primary); 
    font-size: 1.025rem; 
    color: var(--text); 
    margin-bottom: 22px; 
    font-weight:400;
    width: 70%;
  }

  /* ═══════════════════ 9. OPTIONS GRID ═══════════════════
     Buttons users click to select an answer.
     .cols-2 = two columns (Yes/No screens), default = three columns (age) */
  .option-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 18px;
  }
  .option-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
  .option-grid.cols-1 { grid-template-columns: 1fr; }
  .option-btn {
    display: flex; 
    align-items: center; 
    justify-content: space-between;
    border: 0.8px solid var(--border); 
    border-radius: 23px;
    padding: 25px 20px;
    background: var(--white); cursor: pointer; transition: all 0.2s;
    font-family: var(--font-primary); 
    font-size: 1.05rem; 
    font-weight: 500; 
    color: var(--blue);
    text-align: left;
    min-height: 64px;
  }
  .option-btn:hover { border-color: var(--yellow);  }
  .option-btn.selected { border-color: var(--yellow); }
  .option-btn.option-large {
    /* Match Figma: icon stays on left, text is CENTERED in the remaining space.
       Removes the default justify-content: space-between from .option-btn. */
    padding: 38px 28px;
    min-height: 140px;
    justify-content: flex-start;
    gap: 0;
    font-size: 1.15rem;
  }
  .option-btn.option-large > span {
    flex: 1;
    text-align: right;
  }
  .option-btn.option-yesno {
    padding: 22px 28px;
    min-height: 88px;
    justify-content: space-between;
    font-size: 1.15rem;
  }
  .option-icon { flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .option-btn:not(.option-large):not(.option-yesno) .option-icon { width: 30px; height: 30px; }
  .option-btn:not(.option-large):not(.option-yesno) .option-icon svg { max-width: 30px; max-height: 30px; width: auto; height: auto; }
  .option-btn.option-large .option-icon { width: 80px; height: 60px; }
  .option-btn.option-large .option-icon svg { max-width: 80px; max-height: 60px; width: auto; height: auto; }
  .option-btn.option-yesno .option-icon { width: 70px; height: 70px; }
  .option-btn.option-yesno .option-icon svg { max-width: 70px; max-height: 70px; width: auto; height: auto; }

  /* ═══════════════════ 10. ALERT BOX ═══════════════════
     Yellow info box (used for the 3-year-old exception note) */
  .alert-box {
    background: #f5c8424a;
    border-left: 5px solid var(--yellow);
    padding: 16px 40px 16px 20px;
    margin-bottom: 20px;
  } 
  .alert-box-title { font-family: var(--font-primary); font-size: 1rem; font-weight: 700; color: var(--blue); margin-bottom: 6px; }
  .alert-box p { font-family: var(--font-primary); font-size: 0.82rem; color: var(--text); line-height: 1.55; font-weight: 400; }

  /* ═══════════════════ 11. NAV BUTTONS ═══════════════════
     Back (grey pill) and Continue (yellow pill) at the bottom of each step */
  .nav-row { display: flex; justify-content: space-between; margin-top: auto; padding-top: 12px; gap: 12px; }
  .btn-back {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 34px; border-radius: 100px; border: none;
    background: #E8E8E8; font-family: var(--font-primary);
    font-size: 0.95rem; font-weight: 600; color: var(--text);
    cursor: pointer; transition: all 0.2s;
  }
  .btn-back:hover { background: #D8D8D8; }
  .btn-continue {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 38px; border-radius: 100px; border: none;
    background: var(--yellow); font-family: var(--font-primary);
    font-size: 0.95rem; font-weight: 700; color: var(--blue);
    cursor: pointer; transition: all 0.2s;
  }
  .btn-continue:hover:not(:disabled) { background: #ECB820; }
  .btn-continue:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ═══════════════════ 12. RESULT PANEL ═══════════════════
     Final screen — big animal icon + headline + description + buttons */
  .result-panel {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 8px 10px; flex: 1;
  }
  .result-icon { width: 200px; height: 150px; margin-bottom: 22px; display: flex; align-items: center; justify-content: center; }
  .result-icon svg { width: 100%; height: 100%; display: block; }
  .result-headline {
    font-family: var(--font-primary);
    font-size: clamp(1.5rem, 2.8vw, 2.1rem);
    font-weight: 500; 
    color: var(--blue);
    margin-bottom: 20px;
    line-height: 1.15;
  }
  .result-headline .tier { font-weight: 800; }
  .result-desc {
    font-family: var(--font-primary);
    font-size: 0.95rem; color: var(--text);
    max-width: 90%;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .btn-enquire, .btn-restart {
    display: block; width: 100%; max-width: 380px;
    padding: 15px; border-radius: 100px; border: none;
    font-family: var(--font-primary); font-size: 1rem; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
    margin-bottom: 10px;
  }
  .btn-enquire { background: var(--yellow); color: var(--blue); }
  .btn-enquire:hover { background: #ECB820; }
  .btn-restart { background: var(--blue); color: var(--white); }
  .btn-restart:hover { background: #013460; }

  @media (max-width: 900px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; min-width: unset; }
    .option-grid { grid-template-columns: repeat(2,1fr); }
  }
  @media (max-width: 540px) {
    .option-grid { grid-template-columns: 1fr; }
    .option-grid.cols-2 { grid-template-columns: 1fr; }
    .main-card { padding: 18px 18px 22px; }
    .page-wrapper { padding: 16px; }
  }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════════════
     PAGE STRUCTURE
     ────────────────────────────────────────────────────────────────────────
     .page-wrapper                Full-viewport blue background with pool image
       └── .layout                Two-column flexbox
           ├── .sidebar           Left: progress ring + Swim Stages list
           └── .right-column      Right column wrapper
               ├── .page-heading  Big white heading (sits above main card)
               └── .main-card     White card with step tracker + question UI
═══════════════════════════════════════════════════════════════════════════ -->

<div class="page-wrapper">
  <div class="layout">

    <!-- ── SIDEBAR ── -->
    <aside class="sidebar">
      <div class="sidebar-title">Your Progress</div>
      <div class="progress-ring-wrap">
        <div class="ring-container">
          <svg class="ring-svg" viewBox="0 0 130 130">
            <circle class="ring-bg" cx="65" cy="65" r="58"/>
            <circle class="ring-fill" id="ringFill" cx="65" cy="65" r="58"/>
          </svg>
          <div class="ring-label" id="ringLabel">0%</div>
        </div>
      </div>
      <div class="stages-label">Swim Stages</div>
      <div id="stagesList"></div>
    </aside>

    <!-- ── RIGHT COLUMN: heading on top, main card below ── -->
    <div class="right-column">
      <div class="page-heading">
        <h1>Find you child's Swim Level</h1>
        <p>Answer a few quick questions and we'll guide you to the right stage.</p>
      </div>
      <!-- Main card is populated dynamically by renderAll() in the script below -->
      <main class="main-card" id="mainCard"></main>
    </div>

  </div>
</div>

<script>
/* ═══════════════════ 1. ASSET DEFINITIONS: STAGE SVGs ═══════════════════

/* ═══════════════════ 3. STATE ═══════════════════
   Single object holding the entire form state.
   `step` is the macro phase, `_inBeginner` distinguishes the No-lessons sub-flow. */
let state = {
  step: 1,                 // 1=Age, 2=Experience, 3=Skills, 4=Result
  ageKey: null,            // selected age option
  hasHadLessons: null,     // 'yes' | 'no' | null
  // 'no' path
  beginnerIdx: 0,          // current question 0..2
  beginnerAnswers: [],     // ['yes','no',...]
  // 'yes' path
  levelIdx: 1,             // current level being tested 1..4
  levelQIdx: 0,            // current question in that level 0..2
  levelAnswers: { 1:[], 2:[], 3:[], 4:[] },
  // computed
  result: null,
  activeStageIdx: 0,
  progress: 0,
};

/* ═══════════════════ 4. HELPERS ═══════════════════ */
function calculateProgress() {
  if (state.step === 1) return 0;
  if (state.step === 2) return 25;
  if (state.step === 3) return 50;
  if (state.step === 4) return 100;
  return 0;
}

function getActiveStage() {
  if (!state.result) return 0;
  return state.result.stageIdx ?? 0;
}

/* ═══════════════════ 5. RESULT LOGIC ═══════════════════
   Functions that compute which result page to show based on answers. */
function buildResult(type, payload = {}) {
  return { type, ...payload };
}

/* When age path gives an immediate result */
function resultForAge(ageKey) {
  if (ageKey === 'under6m')  return buildResult('too_young');
  if (ageKey === '6to12m')   return buildResult('adult_baby');
  if (ageKey === '12mto2y')  return buildResult('adult_child');
  if (ageKey === '2to3y')    return buildResult('ducklings');
  if (ageKey === '3to4y')    return buildResult('ducklings_exception');
  return null;
}

/* From beginner check answers compute level 1 tier */
function resultFromBeginner(answers) {
  // Q1 NO → L1 BEGINNER
  if (answers[0] === 'no') return buildResult('stage_tier', { stageIdx: 0, tier: 'BEGINNER', note: 'They need to build water confidence first.' });
  // Q2 NO → L1 BEGINNER (with support)
  if (answers[1] === 'no') return buildResult('stage_tier', { stageIdx: 0, tier: 'BEGINNER', note: 'They can do it with support but not alone yet.' });
  // Q3 YES → L1 ADVANCED  / Q3 NO → L1 IMPROVER
  if (answers[2] === 'yes') return buildResult('stage_tier', { stageIdx: 0, tier: 'ADVANCED', note: 'They can enter and return safely.' });
  return buildResult('stage_tier', { stageIdx: 0, tier: 'IMPROVER', note: 'They can jump in but need help getting back.' });
}

/* From level question answers compute stage + tier  */
function resultFromLevel(levelIdx, answers) {
  const stageIdx = levelIdx - 1; // L1 = idx 0, etc

  // Per-level result notes (from PDF spec)
  const NOTES = {
    1: {
      beginner: 'Building water confidence — focus on getting comfortable with the water.',
      improver: 'They are confident but still need a noodle or float for support.',
      advanced_working: 'Working towards back float and safe entry skills.',
    },
    2: {
      beginner: 'Building independent movement — swimming short distances without support.',
      improver: 'Working on streamlined kicking on front and back.',
      advanced_working: 'Working towards arm technique with floats.',
    },
    3: {
      beginner: 'Building front crawl with arms out of the water for 5 metres.',
      improver: 'Working on side breathing and intro breaststroke kick.',
      advanced_working: 'Still refining technique on front crawl and backstroke.',
    },
    4: {
      beginner: 'Working towards kneeling dive and 10m front crawl with bilateral breathing.',
      improver: 'Building all 4 strokes for half a length.',
      advanced_working: 'Building distance on main strokes — full length F/C and B/S.',
    },
  };

  const notes = NOTES[levelIdx];
  // Q1 NO → BEGINNER
  if (answers[0] === 'no') return buildResult('stage_tier', { stageIdx, tier: 'BEGINNER', note: notes.beginner });
  // Q2 NO → IMPROVER
  if (answers[1] === 'no') return buildResult('stage_tier', { stageIdx, tier: 'IMPROVER', note: notes.improver });
  // Q3 YES → ADVANCED (nearly ready for next)
  if (answers[2] === 'yes') {
    const next = STAGES[stageIdx + 1];
    return buildResult('stage_tier', { stageIdx, tier: 'ADVANCED', note: `Nearly ready for ${next ? next.level + ' ' + next.name : 'the next level'}!`, nearlyReady: true });
  }
  // Q3 NO → ADVANCED (still working)
  return buildResult('stage_tier', { stageIdx, tier: 'ADVANCED', note: notes.advanced_working, stillWorking: true });
}

/* ═══════════════════ 7. RENDERERS ═══════════════════
   Functions that return HTML strings for each part of the UI. */

/* renderStepTracker — the 4-dot progress tracker at the top of the main card */
function renderStepTracker(currentStep) {
  return `<div class="step-tracker">${
    STEPS.map((s,i)=>{
      const active = s.id <= currentStep;
      const dot = `<div class="step-dot${active?'':' inactive'}">${s.id}</div>`;
      const lbl = `<span class="step-label${active?'':' inactive'}">${s.label}</span>`;
      const line = i < STEPS.length-1 ? `<div class="step-line"></div>` : '';
      return `<div class="step-item">${dot}${lbl}</div>${line}`;
    }).join('')
  }</div>`;
}

/* renderSidebar — updates progress ring + active stage in the sidebar */
function renderSidebar() {
  const circ = 2 * Math.PI * 58;
  const filled = (state.progress / 100) * circ;
  const ring = document.getElementById('ringFill');
  ring.style.strokeDasharray = `${filled} ${circ}`;
  document.getElementById('ringLabel').textContent = state.progress + '%';

  document.getElementById('stagesList').innerHTML = STAGES.map((s,i) => `
    <div class="stage-item${i === state.activeStageIdx ? ' active' : ''}">
      <div class="stage-icon">${SVGS[s.svgId]}</div>
      <div class="stage-text">
        <div class="stage-level">${s.level}</div>
        <div class="stage-name">${s.name}</div>
        <div class="stage-desc">${s.desc}</div>
      </div>
    </div>
  `).join('');
}

function renderStep2() {
  /* STEP 2 — EXPERIENCE
     "Has the child had swimming lessons before?" with two big Yes/No cards.
     YES → Step 3 (Skills, starting at Level 1). NO → Beginner check sub-flow. */
  return renderStepTracker(2) + `
    <div class="q-section">
      <div class="q-container">
        <div class="q-meta">Step 2 of 4</div>
        <div class="q-title">Has the child had swimming lessons before?</div>
        <div class="q-subtitle">This helps us find the right starting point.</div>
      </div>
      <div class="option-grid cols-2">
        <button class="option-btn option-large${state.hasHadLessons==='yes'?' selected':''}" onclick="selectLessons('yes')">
          <div class="option-icon">${SWIMMER_SVG}</div>
          <span>Yes, they have had lesson</span>
        </button>
        <button class="option-btn option-large${state.hasHadLessons==='no'?' selected':''}" onclick="selectLessons('no')">
          <div class="option-icon">${THINK_SVG}</div>
          <span>No, never had lesson</span>
        </button>
      </div>
      <div class="nav-row">
        <button class="btn-back" onclick="goBack()">\u2190 Back</button>
        <button class="btn-continue" onclick="continueStep()" ${state.hasHadLessons?'':'disabled'}>Continue \u2192</button>
      </div>
    </div>`;
}

function renderBeginnerCheck() {
  /* BEGINNER CHECK (sub-flow of Step 2 when user picked "No lessons")
     3 questions to determine Level 1 tier (BEGINNER/IMPROVER/ADVANCED).
     Q1 NO and Q2 NO short-circuit straight to result. */
  const idx = state.beginnerIdx;
  const q = BEGINNER_QUESTIONS[idx];
  const answered = state.beginnerAnswers[idx];
  return renderStepTracker(2) + `
    <div class="q-section">
      <div class="q-container">
        <div class="q-meta">Step 2 of 4 <span class="dot"></span><span>Beginner check - ${idx+1} of 3</span></div>
        <div class="q-title">${q.q}</div>
        <div class="q-subtitle">${q.sub}</div>
      </div>
      <div class="option-grid cols-2">
        <button class="option-btn option-yesno${answered==='yes'?' selected':''}" onclick="answerBeginner('yes')">
          <div class="option-icon">${YES_SVG}</div>
          <span>Yes, they can</span>
        </button>
        <button class="option-btn option-yesno${answered==='no'?' selected':''}" onclick="answerBeginner('no')">
          <div class="option-icon">${NO_SVG}</div>
          <span>No, not yet</span>
        </button>
      </div>
      <div class="nav-row">
        <button class="btn-back" onclick="goBack()">\u2190 Back</button>
        <button class="btn-continue" onclick="continueBeginner()" ${answered?'':'disabled'}>Continue \u2192</button>
      </div>
    </div>`;
}

function renderStep3() {
  /* STEP 3 — SKILLS (Yes lessons path)
     One question at a time across Levels 1-4. State tracks current level + q index.
     Q1 NO → BEGINNER, Q2 NO → IMPROVER, Q3 NO → ADVANCED, Q3 YES → next level. */
  const level = state.levelIdx;
  const qIdx = state.levelQIdx;
  const data = LEVEL_QUESTIONS[level];
  const q = data.qs[qIdx];
  const answered = state.levelAnswers[level][qIdx];
  return renderStepTracker(3) + `
    <div class="q-section">
      <div class="q-container">
        <div class="q-meta">Step 3 of 4 <span class="dot"></span> <span>${data.name} \u2014 ${data.level}</span> <span class="dot"></span> <span>Q - ${qIdx+1} of 3</span></div>
        <div class="q-title">${q.q}</div>
        <div class="q-subtitle">${q.sub}</div>
      </div>
      <div class="option-grid cols-2">
        <button class="option-btn option-yesno${answered==='yes'?' selected':''}" onclick="answerLevel('yes')">
          <div class="option-icon">${YES_SVG}</div>
          <span>Yes, they can</span>
        </button>
        <button class="option-btn option-yesno${answered==='no'?' selected':''}" onclick="answerLevel('no')">
          <div class="option-icon">${NO_SVG}</div>
          <span>No, not yet</span>
        </button>
      </div>
      <div class="nav-row">
        <button class="btn-back" onclick="goBack()">\u2190 Back</button>
        <button class="btn-continue" onclick="continueLevel()" ${answered?'':'disabled'}>Continue \u2192</button>
      </div>
    </div>`;
}

/* ═══════════════════ 6. AGE_RESULT_CONTENT + renderResult ═══════════════════
   Copy for age-based result pages (under 6m, 6-12m, etc).
   Edit headlines or descriptions here. */
const AGE_RESULT_CONTENT = {
  /* iconKey:
     - A key from AGE_ICONS (e.g. 'under6m', '6to12m') → shows that age icon
     - null                                            → shows no icon at all (text-only result) */
  too_young:           { title: 'Too young for lessons yet',          iconKey: 'under6m',  desc: 'Children under 6 months are not yet ready for formal swimming lessons. We recommend returning at 6 months.' },
  adult_baby:          { title: 'Adult & Baby classes available',     iconKey: '6to12m',   desc: 'At this age, we offer parent-and-baby sessions in a warm, shallow pool. A great start!' },
  adult_child:         { title: 'Adult & Child classes recommended',  iconKey: '12mto2y',  desc: 'At 12 months to 2 years, your child is ready for our Adult & Child programme, where you swim together to build confidence and early water skills in a supported, playful environment.' },
  ducklings:           { title: 'Ducklings (Teacher & Toddler)',      iconKey: '2to3y',    desc: 'Children aged 2\u20133 years join our Ducklings class, where a parent or carer stays in the water to help build confidence and early swim skills.' },
  ducklings_exception: { title: '3\u20134 year-old exception<br>Ducklings (Teacher & Toddler)', iconKey: null, desc: 'If the child is 3\u20134 years old and the parent says they are <strong>confident in the water</strong> and <strong>happy to go in without mum or dad</strong>, they could be suitable for our Ducklings class (teacher-led, no parent in water). <strong>Confidence is the key thing</strong>. If there is any doubt, keep them in Adult & Child.' },
};

function renderResult() {
  const r = state.result;
  let iconHtml, headline, desc;

  if (r.type === 'stage_tier') {
    /* Skills / Beginner check results — use the stage animal SVG */
    const s = STAGES[r.stageIdx];
    iconHtml = SVGS[s.svgId];
    headline = r.tier
      ? `${s.level} \u2014 ${s.name} \u00b7 <span class="tier">${r.tier}</span>`
      : `${s.level} \u2014 ${s.name}`;
    desc = r.note || (
      r.nearlyReady ? `Nearly ready for the next level!` :
      r.stillWorking ? `Still building skills at this level.` :
      `Your child fits at this level.`
    );
  } else {
    /* Age-based results — use the matching RESULT_ICONS illustration,
       or no icon if iconKey is null (e.g. 3-4y exception is text-only) */
    const c = AGE_RESULT_CONTENT[r.type];
    iconHtml = c.iconKey ? RESULT_ICONS[c.iconKey] : null;
    headline = c.title;
    desc = c.desc;
  }

  /* Only render the .result-icon div when there's an icon to show */
  const iconBlock = iconHtml ? `<div class="result-icon">${iconHtml}</div>` : '';

  return renderStepTracker(4) + `
    <div class="result-panel">
      ${iconBlock}
      <div class="result-headline">${headline}</div>
      <p class="result-desc">${desc}</p>
      <button class="btn-enquire">Enquire about classes</button>
      <button class="btn-restart" onclick="restart()">Start again</button>
    </div>`;
}

/* ─── ACTIONS ─── */
function selectAge(key) {
  state.ageKey = key;
  renderAll();
}

function selectLessons(val) {
  state.hasHadLessons = val;
  renderAll();
}

function answerBeginner(val) {
  state.beginnerAnswers[state.beginnerIdx] = val;
  renderAll();
}

function answerLevel(val) {
  state.levelAnswers[state.levelIdx][state.levelQIdx] = val;
  renderAll();
}

function continueBeginner() {
  const idx = state.beginnerIdx;
  const ans = state.beginnerAnswers[idx];
  if (!ans) return;
  // Decision logic
  if (idx === 0 && ans === 'no') {
    state.result = resultFromBeginner(state.beginnerAnswers);
    state.activeStageIdx = state.result.stageIdx;
    state.step = 4;
    state.progress = 100;
  } else if (idx === 1 && ans === 'no') {
    state.result = resultFromBeginner(state.beginnerAnswers);
    state.activeStageIdx = state.result.stageIdx;
    state.step = 4;
    state.progress = 100;
  } else if (idx === 2) {
    state.result = resultFromBeginner(state.beginnerAnswers);
    state.activeStageIdx = state.result.stageIdx;
    state.step = 4;
    state.progress = 100;
  } else {
    state.beginnerIdx = idx + 1;
  }
  renderAll();
}

function continueLevel() {
  const level = state.levelIdx;
  const qIdx = state.levelQIdx;
  const ans = state.levelAnswers[level][qIdx];
  if (!ans) return;

  if (qIdx === 0 && ans === 'no') {
    // BEGINNER at current level
    state.result = resultFromLevel(level, state.levelAnswers[level]);
    state.activeStageIdx = state.result.stageIdx;
    state.step = 4; state.progress = 100;
  } else if (qIdx === 1 && ans === 'no') {
    // IMPROVER
    state.result = resultFromLevel(level, state.levelAnswers[level]);
    state.activeStageIdx = state.result.stageIdx;
    state.step = 4; state.progress = 100;
  } else if (qIdx === 2) {
    if (ans === 'no') {
      // ADVANCED still working
      state.result = resultFromLevel(level, state.levelAnswers[level]);
      state.activeStageIdx = state.result.stageIdx;
      state.step = 4; state.progress = 100;
    } else {
      // ans === 'yes' → answered yes to all 3 at this level → move to next level
      if (level >= 4) {
        // passed level 4 with all yes → Level 5 (Dolphins/Mantas/Orcas)
        state.result = buildResult('stage_tier', { stageIdx: 4, tier: '', note: 'They will be swim-tested on their first session and their level will be updated based on the assessment. There are no phone questions for Level 5+ — the teacher needs to see them.' });
        state.activeStageIdx = 4;
        state.step = 4; state.progress = 100;
      } else {
        state.levelIdx = level + 1;
        state.levelQIdx = 0;
      }
    }
  } else {
    state.levelQIdx = qIdx + 1;
  }
  renderAll();
}

function continueStep() {
  if (state.step === 1) {
    if (!state.ageKey) return;
    // Direct results for younger ages
    if (state.ageKey !== '4yplus') {
      state.result = resultForAge(state.ageKey);
      state.activeStageIdx = 0;
      state.step = 4;
      state.progress = 100;
    } else {
      state.step = 2;
      state.progress = 25;
    }
  } else if (state.step === 2) {
    if (!state.hasHadLessons) return;
    state.step = 3;
    state.progress = 50;
    if (state.hasHadLessons === 'no') {
      // Beginner check path (still labelled "Step 2" in meta, but progress moves to 50%)
      // Actually keep at step 2 with internal beginnerIdx
      state.step = 2;
      state.progress = 25;
      state.beginnerIdx = 0;
      // Use a flag to know we're in beginner sub-flow
      state._inBeginner = true;
    } else {
      // Yes lessons path - start level 1 questions
      state.levelIdx = 1;
      state.levelQIdx = 0;
    }
  }
  renderAll();
}

function goBack() {
  // If at result, restart to step 1
  if (state.step === 4) {
    // Determine where to go back to
    if (['under6m','6to12m','12mto2y','2to3y','3to4y'].includes(state.ageKey)) {
      state.step = 1; state.progress = 0;
      state.result = null;
    } else if (state._inBeginner) {
      // go back to last beginner question
      state.step = 2; state.progress = 25;
      state._inBeginner = true;
      state.beginnerIdx = Math.min(2, state.beginnerAnswers.length - 1);
      if (state.beginnerIdx < 0) state.beginnerIdx = 0;
      state.result = null;
    } else {
      // Yes path - return to last level question
      state.step = 3; state.progress = 50;
      state.result = null;
    }
  } else if (state.step === 3) {
    if (state.levelQIdx > 0) {
      state.levelQIdx--;
    } else if (state.levelIdx > 1) {
      state.levelIdx--;
      state.levelQIdx = 2;
    } else {
      // Back to step 2
      state.step = 2; state.progress = 25;
    }
  } else if (state.step === 2) {
    if (state._inBeginner) {
      if (state.beginnerIdx > 0) {
        state.beginnerIdx--;
      } else {
        state._inBeginner = false;
        state.step = 2; // stay at step 2 main question
      }
    } else {
      state.step = 1; state.progress = 0;
    }
  }
  renderAll();
}

function restart() {
  state = {
    step: 1, ageKey: null, hasHadLessons: null,
    beginnerIdx: 0, beginnerAnswers: [],
    levelIdx: 1, levelQIdx: 0,
    levelAnswers: { 1:[], 2:[], 3:[], 4:[] },
    result: null, activeStageIdx: 0, progress: 0,
    _inBeginner: false,
  };
  renderAll();
}

function renderAll() {
  state.progress = calculateProgress();
  // Override progress for beginner sub-flow (stay at 25% during the 3 sub-questions)
  if (state._inBeginner && state.step === 2) {
    state.progress = 25;
  }
  renderSidebar();
  const card = document.getElementById('mainCard');
  if (state.step === 1) card.innerHTML = renderStep1();
  else if (state.step === 2) {
    if (state._inBeginner) card.innerHTML = renderBeginnerCheck();
    else card.innerHTML = renderStep2();
  }
  else if (state.step === 3) card.innerHTML = renderStep3();
  else card.innerHTML = renderResult();
}

renderAll();
</script>
</body>
</html>
