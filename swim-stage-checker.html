<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your Child's Swim Level</title>
<link href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #024070;
    --yellow: #F5C842;
    --black: #000000;
    --border: #D5D5D5;
    --grey-bg: #F9F9F9;
    --text: #607380;
    --white: #ffffff;
    --font-primary: 'Dosis', sans-serif;
    --font-secondary: 'Poppins', sans-serif;
  }

  body {
    font-family: var(--font-secondary);
    background: #e8f4f8;
    min-height: 100vh;
  }

  /* ── OUTER WRAPPER ── */
  .page-wrapper {
    background: #1A90D9;
    min-height: 100vh;
    padding: 40px 20px 60px;
    position: relative;
    overflow: hidden;
  }
  .page-wrapper::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 10% 50%, transparent 280px, rgba(255,255,255,0.06) 281px, rgba(255,255,255,0.06) 283px, transparent 284px),
      radial-gradient(circle at 10% 50%, transparent 340px, rgba(255,255,255,0.05) 341px, rgba(255,255,255,0.05) 343px, transparent 344px),
      radial-gradient(circle at 10% 50%, transparent 400px, rgba(255,255,255,0.04) 401px, rgba(255,255,255,0.04) 403px, transparent 404px),
      radial-gradient(circle at 10% 50%, transparent 460px, rgba(255,255,255,0.03) 461px, rgba(255,255,255,0.03) 463px, transparent 464px);
    pointer-events: none;
  }

  /* ── HEADING AREA ── */
  .page-title {
    text-align: center;
    margin-bottom: 32px;
    position: relative;
    z-index: 1;
  }
  .page-title h1 {
    font-family: var(--font-primary);
    font-size: clamp(2.2rem, 5vw, 3.6rem);
    font-weight: 800;
    color: var(--white);
    line-height: 1.05;
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }
  .page-title p {
    font-family: var(--font-secondary);
    font-size: 1rem;
    color: rgba(255,255,255,0.92);
    font-weight: 400;
  }

  /* ── LAYOUT ── */
  .layout {
    display: flex;
    gap: 24px;
    max-width: 1240px;
    margin: 0 auto;
    align-items: stretch;
    position: relative;
    z-index: 1;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    background: var(--white);
    border-radius: 16px;
    padding: 30px 26px;
    width: 320px;
    min-width: 320px;
    flex-shrink: 0;
    box-shadow: 0 6px 28px rgba(0,0,0,0.10);
    display: flex;
    flex-direction: column;
  }
  .sidebar-title {
    font-family: var(--font-primary);
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--blue);
    text-align: center;
    margin-bottom: 22px;
  }

  /* progress ring */
  .progress-ring-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 28px;
  }
  .ring-container {
    position: relative;
    width: 130px;
    height: 130px;
  }
  .ring-svg {
    width: 130px;
    height: 130px;
    transform: rotate(-90deg);
  }
  .ring-bg { fill: none; stroke: #ECECEC; stroke-width: 7; }
  .ring-fill {
    fill: none;
    stroke: var(--yellow);
    stroke-width: 7;
    stroke-linecap: round;
    stroke-dasharray: 0;
    stroke-dashoffset: 0;
    transition: stroke-dasharray 0.6s ease;
  }
  .ring-label {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-primary);
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--blue);
  }

  /* swim stages list */
  .stages-label {
    font-family: var(--font-secondary);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--text);
    text-align: center;
    text-transform: uppercase;
    margin-bottom: 18px;
    margin-top: 4px;
  }
  .stage-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    border-radius: 12px;
    margin-bottom: 6px;
    border: 1.5px solid transparent;
    cursor: default;
    transition: all 0.2s;
  }
  .stage-item.active {
    border-color: var(--yellow);
    background: #FFFCF1;
  }
  .stage-icon {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .stage-icon svg { width: 100%; height: auto; max-width: 44px; max-height: 44px; }
  .stage-level {
    font-family: var(--font-primary);
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--yellow);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 1px;
  }
  .stage-name {
    font-family: var(--font-primary);
    font-size: 1.02rem;
    font-weight: 700;
    color: var(--blue);
    line-height: 1.15;
    margin-bottom: 2px;
  }
  .stage-desc {
    font-family: var(--font-secondary);
    font-size: 0.7rem;
    color: var(--text);
    line-height: 1.35;
  }

  /* ── MAIN CARD ── */
  .main-card {
    background: var(--white);
    border-radius: 16px;
    padding: 34px 40px 36px;
    flex: 1;
    box-shadow: 0 6px 28px rgba(0,0,0,0.10);
    display: flex;
    flex-direction: column;
  }

  /* step tracker */
  .step-tracker {
    display: flex;
    align-items: center;
    gap: 0;
    margin-bottom: 32px;
    padding-bottom: 22px;
    border-bottom: 1.5px solid var(--border);
  }
  .step-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .step-dot {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--yellow);
    color: var(--black);
    font-family: var(--font-primary);
    font-size: 0.9rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .step-dot.inactive {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--text);
  }
  .step-label {
    font-family: var(--font-secondary);
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--black);
  }
  .step-label.inactive { color: var(--text); }
  .step-line {
    flex: 1;
    height: 0;
    border-top: 1.5px dashed #C8C8C8;
    margin: 0 14px;
  }

  /* ── QUESTION PANEL ── */
  .q-meta {
    font-family: var(--font-secondary);
    font-size: 0.9rem;
    color: var(--text);
    margin-bottom: 8px;
    font-weight: 400;
  }
  .q-title {
    font-family: var(--font-primary);
    font-size: clamp(1.5rem, 3vw, 2rem);
    font-weight: 700;
    color: var(--blue);
    margin-bottom: 6px;
    line-height: 1.15;
  }
  .q-subtitle {
    font-family: var(--font-secondary);
    font-size: 0.92rem;
    color: var(--text);
    margin-bottom: 26px;
  }

  /* option grid */
  .option-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 22px;
  }
  .option-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    background: var(--white);
    cursor: pointer;
    transition: all 0.2s;
    font-family: var(--font-primary);
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--blue);
    text-align: left;
  }
  .option-btn:hover {
    border-color: var(--yellow);
    background: #FFFCF1;
  }
  .option-btn.selected {
    border-color: var(--yellow);
    background: #FFFCF1;
  }
  .option-icon {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .option-icon svg { width: 100%; height: 100%; max-width: 30px; max-height: 30px; }

  /* alert box */
  .alert-box {
    background: #FFF7DD;
    border: 1.5px solid var(--yellow);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 24px;
  }
  .alert-box-title {
    font-family: var(--font-primary);
    font-size: 1rem;
    font-weight: 700;
    color: var(--blue);
    margin-bottom: 6px;
  }
  .alert-box p {
    font-family: var(--font-secondary);
    font-size: 0.82rem;
    color: var(--text);
    line-height: 1.55;
  }

  /* nav buttons */
  .nav-row {
    display: flex;
    justify-content: space-between;
    margin-top: auto;
    padding-top: 18px;
    gap: 12px;
  }
  .btn-back {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 13px 32px;
    border-radius: 100px;
    border: none;
    background: #E8E8E8;
    font-family: var(--font-primary);
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-back:hover { background: #D8D8D8; }
  .btn-continue {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 13px 38px;
    border-radius: 100px;
    border: none;
    background: var(--yellow);
    font-family: var(--font-primary);
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--blue);
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-continue:hover:not(:disabled) { background: #ECB820; }
  .btn-continue:disabled { opacity: 0.55; cursor: not-allowed; }

  /* ── RESULT PANEL ── */
  .result-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px 10px 10px;
  }
  .result-icon {
    width: 180px;
    height: 155px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .result-icon svg { max-width: 100%; max-height: 100%; width: auto; height: auto; }
  .result-title {
    font-family: var(--font-primary);
    font-size: clamp(1.4rem, 3vw, 1.9rem);
    font-weight: 800;
    color: var(--blue);
    margin-bottom: 10px;
  }
  .result-desc {
    font-family: var(--font-secondary);
    font-size: 0.82rem;
    color: var(--text);
    max-width: 480px;
    line-height: 1.6;
    margin-bottom: 28px;
  }
  .result-level-badge {
    display: inline-block;
    background: var(--yellow);
    color: var(--blue);
    font-family: var(--font-primary);
    font-weight: 700;
    font-size: 0.85rem;
    padding: 5px 16px;
    border-radius: 100px;
    margin-bottom: 6px;
    letter-spacing: 0.04em;
  }
  .result-level-name {
    font-family: var(--font-primary);
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--blue);
    margin-bottom: 8px;
  }
  .btn-enquire {
    display: block;
    width: 100%;
    max-width: 380px;
    padding: 15px;
    border-radius: 100px;
    border: none;
    background: var(--yellow);
    font-family: var(--font-primary);
    font-size: 1rem;
    font-weight: 700;
    color: var(--blue);
    cursor: pointer;
    margin-bottom: 12px;
    transition: all 0.2s;
  }
  .btn-enquire:hover { background: #e8b800; }
  .btn-restart {
    display: block;
    width: 100%;
    max-width: 380px;
    padding: 15px;
    border-radius: 100px;
    border: none;
    background: var(--blue);
    font-family: var(--font-primary);
    font-size: 1rem;
    font-weight: 700;
    color: var(--white);
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-restart:hover { background: #013460; }

  /* skill checkboxes (step 3) */
  .skill-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .skill-option:hover { border-color: var(--yellow); }
  .skill-option.selected { border-color: var(--yellow); background: rgba(245,200,66,0.07); }
  .skill-check {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .skill-option.selected .skill-check {
    background: var(--yellow);
    border-color: var(--yellow);
  }
  .skill-check::after {
    content: '';
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--blue);
    opacity: 0;
    transition: opacity 0.15s;
  }
  .skill-option.selected .skill-check::after { opacity: 1; }
  .skill-text {
    font-family: var(--font-primary);
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--blue);
  }

  @media (max-width: 760px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; }
    .option-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 480px) {
    .option-grid { grid-template-columns: 1fr; }
    .main-card { padding: 20px 16px; }
  }
</style>
</head>
<body>
<div class="page-wrapper">
  <div class="page-title">
    <h1>Find you child's Swim Level</h1>
    <p>Answer a few quick questions and we'll guide you to the right stage.</p>
  </div>

  <div class="layout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-title">Your Progress</div>
      <div class="progress-ring-wrap">
        <div class="ring-container">
          <svg class="ring-svg" viewBox="0 0 130 130">
            <circle class="ring-bg" cx="65" cy="65" r="58"/>
            <circle class="ring-fill" id="ringFill" cx="65" cy="65" r="58"/>
          </svg>
          <div class="ring-label" id="ringLabel">0%</div>
        </div>
      </div>
      <div class="stages-label">Swim Stages</div>
      <div id="stagesList"></div>
    </aside>

    <!-- MAIN CARD -->
    <main class="main-card" id="mainCard"></main>
  </div>
</div>

<script>

  { level: 'Level 4', name: 'Sharks',                desc: 'Full strokes and building distance', svgId: 'shark' },

/* ─── SKILLS (step 3, for 4yplus) ─── */
const SKILL_OPTIONS = [
  { key: 'float',  label: 'Can float on their back unaided' },
  { key: 'kick',   label: 'Can kick legs while holding a float' },
  { key: 'submerge', label: 'Happy to submerge their face' },
  { key: 'arms',   label: 'Uses arm movements to move through water' },
  { key: '25m',    label: 'Can swim 25m or more independently' },
];

/* ─── RESULT LOGIC ─── */
function computeResult() {
  const { ageKey, experienceKey, skills } = state;

  if (ageKey === 'under6m') return { type: 'too_young' };
  if (ageKey === '6to12m')  return { type: 'adult_baby' };
  if (ageKey === '12mto2y') return { type: 'adult_child' };
  if (ageKey === '2to3y')   return { type: 'ducklings' };

  if (ageKey === '3to4y') {
    // 3yo exception — ducklings if confident, otherwise adult & child
    return { type: 'ducklings_exception' };
  }

  // 4yplus — use experience + skills
  if (experienceKey === 'none' || experienceKey === 'little') {
    return { type: 'stage', stageIdx: 0 }; // Turtles
  }
  if (skills.includes('25m')) {
    if (skills.length >= 4) return { type: 'stage', stageIdx: 4 }; // Dolphins
    return { type: 'stage', stageIdx: 3 }; // Sharks
  }
  if (skills.includes('arms') && skills.includes('float')) {
    return { type: 'stage', stageIdx: 2 }; // Seahorses
  }
  if (skills.includes('kick') || skills.includes('submerge')) {
    return { type: 'stage', stageIdx: 1 }; // Otters
  }
  return { type: 'stage', stageIdx: 0 }; // Turtles
}

/* ─── RENDER HELPERS ─── */
function renderStepTracker(currentStep) {
  return STEPS.map((s, i) => {
    const isActive = s.id <= currentStep;
    const dot = `<div class="step-dot${isActive ? '' : ' inactive'}">${s.id}</div>`;
    const lbl = `<span class="step-label${isActive ? '' : ' inactive'}">${s.label}</span>`;
    const line = i < STEPS.length - 1 ? `<div class="step-line"></div>` : '';
    return `<div class="step-item">${dot}${lbl}</div>${line}`;
  }).join('');
}

function renderSidebar() {
  // Progress ring — use dasharray for smooth 0%-friendly fill
  const pct = state.progress;
  const circ = 2 * Math.PI * 58;
  const filled = (pct / 100) * circ;
  const ringEl = document.getElementById('ringFill');
  ringEl.style.strokeDasharray = `${filled} ${circ}`;
  document.getElementById('ringLabel').textContent = pct + '%';

  // Stages
  const list = document.getElementById('stagesList');
  list.innerHTML = STAGES.map((s, i) => `
    <div class="stage-item${i === state.activeStageIdx ? ' active' : ''}">
      <div class="stage-icon">${SVGS[s.svgId]}</div>
      <div class="stage-text">
        <div class="stage-level">${s.level}</div>
        <div class="stage-name">${s.name}</div>
        <div class="stage-desc">${s.desc}</div>
      </div>
    </div>
  `).join('');
}

/* ─── STEP RENDERERS ─── */
function renderStep1() {
  const tracker = renderStepTracker(1);
  return `
    <div class="step-tracker">${tracker}</div>
    <div class="q-meta">Step 1 of 4</div>
    <div class="q-title">How old is your child?</div>
    <div class="q-subtitle">Select the age group that best fits.</div>
    <div class="option-grid">
      ${AGE_OPTIONS.map(o => `
        <button class="option-btn${state.ageKey === o.key ? ' selected' : ''}" onclick="selectAge('${o.key}')">
          <div class="option-icon">${AGE_ICONS[o.icon]}</div>
          ${o.label}
        </button>
      `).join('')}
    </div>
    <div class="alert-box">
      <div class="alert-box-title">3-year-old exception — Ducklings (Teacher & Toddler)</div>
      <p>If the child is 3 AND the parent says they are confident in the water and happy to go in without mum or dad, they could be suitable for our Ducklings class (teacher-led, no parent in water). Confidence is the key thing — if there is any doubt, keep them in Adult & Child</p>
    </div>
    <div class="nav-row">
      <button class="btn-back" onclick="goBack()">← Back</button>
      <button class="btn-continue" onclick="continueStep()" ${state.ageKey ? '' : 'disabled'}>Continue →</button>
    </div>
  `;
}

  return `

    <div class="q-subtitle">Select the option that best describes your child.</div>
    <div class="option-grid" style="grid-template-columns: repeat(2,1fr);">
      ${EXP_OPTIONS.map(o => `
        <button class="option-btn${state.experienceKey === o.key ? ' selected' : ''}" onclick="selectExp('${o.key}')">
          <div class="option-icon">${EXP_ICONS[o.icon]}</div>
          ${o.label}
        </button>
      `).join('')}
    </div>
    <div class="nav-row">
      <button class="btn-back" onclick="goBack()">← Back</button>
      <button class="btn-continue" onclick="continueStep()" ${state.experienceKey ? '' : 'disabled'}>Continue →</button>
    </div>
  `;
}

function renderStep3() {
  const tracker = renderStepTracker(3);
  return `
    <div class="step-tracker">${tracker}</div>
    <div class="q-meta">Step 3 of 4</div>
    <div class="q-title">Which skills can they do?</div>
    <div class="q-subtitle">Select all that apply — it's okay if none apply yet!</div>
    <div style="margin-bottom:20px;">
      ${SKILL_OPTIONS.map(s => `
        <div class="skill-option${state.skills.includes(s.key) ? ' selected' : ''}" onclick="toggleSkill('${s.key}')">
          <div class="skill-check"></div>
          <div class="skill-text">${s.label}</div>
        </div>
      `).join('')}
    </div>
    <div class="nav-row">
      <button class="btn-back" onclick="goBack()">← Back</button>
      <button class="btn-continue" onclick="continueStep()">See Results →</button>
    </div>
  `;
}

function renderResult() {
  const tracker = renderStepTracker(4);
  const result = computeResult();
  let iconHtml, titleHtml, descHtml;

  if (result.type === 'stage') {
    const s = STAGES[result.stageIdx];
    // Stage animal icons — scale up to fill the result icon container
    iconHtml = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;">${SVGS[s.svgId]}</div>`;
    titleHtml = `<div class="result-level-badge">${s.level}</div><div class="result-level-name">${s.name}</div>`;
    descHtml = `Based on your answers, your child is best suited for our <strong>${s.name}</strong> class — ${s.desc.toLowerCase()}.`;
  } else {
    const c = RESULT_CONTENT[result.type];
    // Use the exact provided SVGs — rendered at their natural proportions inside the icon box
    iconHtml = RESULT_ICONS[c.iconKey];
    const lines = c.title.split('\n');
    titleHtml = lines.map((l, i) => {
      const small = i === 0 && lines.length > 1 ? 'font-size:1.1rem;' : '';
      const wrap = c.isBold && i > 0 ? `<strong>${l}</strong>` : l;
      return `<div class="result-title" style="${small}">${wrap}</div>`;
    }).join('');
    descHtml = c.desc;
  }

  return `
    <div class="step-tracker">${tracker}</div>
    <div class="result-panel">
      <div class="result-icon">${iconHtml}</div>
      ${titleHtml}
      <p class="result-desc">${descHtml}</p>
      <button class="btn-enquire">Enquire about classes</button>
      <button class="btn-restart" onclick="restart()">Start again</button>
    </div>
  `;
}

/* ─── ACTIONS ─── */
function selectAge(key) {
  state.ageKey = key;
  renderAll();
}
function selectExp(key) {
  state.experienceKey = key;
  renderAll();
}
function toggleSkill(key) {
  const idx = state.skills.indexOf(key);
  if (idx >= 0) state.skills.splice(idx, 1);
  else state.skills.push(key);
  renderAll();
}

function continueStep() {
  if (state.step === 1) {
    if (!state.ageKey) return;
    // Direct results for early ages
    if (['under6m','6to12m','12mto2y','2to3y','3to4y'].includes(state.ageKey)) {
      state.step = 4;
      state.progress = 100;
    } else {
      state.step = 2;
      state.progress = 33;
    }
  } else if (state.step === 2) {
    if (!state.experienceKey) return;
    if (state.experienceKey === 'none' || state.experienceKey === 'little') {
      state.step = 4;
      state.progress = 100;
    } else {
      state.step = 3;
      state.progress = 66;
    }
  } else if (state.step === 3) {
    state.step = 4;
    state.progress = 100;
  }
  setActiveStage();
  renderAll();
}

function goBack() {
  if (state.step === 1) return;
  if (state.step === 4) {
    if (['under6m','6to12m','12mto2y','2to3y','3to4y'].includes(state.ageKey)) {
      state.step = 1; state.progress = 0;
    } else if (state.experienceKey === 'none' || state.experienceKey === 'little') {
      state.step = 2; state.progress = 33;
    } else {
      state.step = 3; state.progress = 66;
    }
  } else if (state.step === 3) {
    state.step = 2; state.progress = 33;
  } else if (state.step === 2) {
    state.step = 1; state.progress = 0;
  }
  renderAll();
}

function restart() {
  state = { step:1, ageKey:null, experienceKey:null, skills:[], activeStageIdx:0, progress:0 };
  renderAll();
}

function setActiveStage() {
  if (state.step !== 4) return;
  const r = computeResult();
  if (r.type === 'stage') state.activeStageIdx = r.stageIdx;
  else state.activeStageIdx = 0;
}

function renderAll() {
  renderSidebar();
  const card = document.getElementById('mainCard');
  if (state.step === 1) card.innerHTML = renderStep1();
  else if (state.step === 2) card.innerHTML = renderStep2();
  else if (state.step === 3) card.innerHTML = renderStep3();
  else card.innerHTML = renderResult();
}

renderAll();
</script>
</body>
</html>
